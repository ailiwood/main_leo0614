# configs/models/deeptext_xlstm_awaf_residual_mosi.yaml
# DeepText-xLSTM-AWAF Residual — MOSI 强特征配置
# 数据: data/features_strong_sequence_mosi_v3_T40/
# dims: text=1024, audio=768, vision=768

model:
  name: "DeepTextXLSTMAWAFResidual"
  # --- 维度 ---
  text_dim: 1024
  audio_dim: 768
  vision_dim: 768
  hidden_dim: 256

  # --- Text branch (主判别, NO sLSTM) ---
  text_mlp_hidden: 512
  text_mlp_layers: 3
  text_mlp_dropout: 0.3

  # --- sLSTM (audio/vision only) ---
  slstm_num_layers: 1
  slstm_dropout: 0.3
  slstm_pooling: "masked_mean"

  # --- AWAF ---
  awaf_fusion_mode: "awaf"
  awaf_tau_init: 1.0
  awaf_dropout: 0.1
  awaf_modality_dropout: true
  awaf_modality_dropout_prob: 0.1

  # --- Residual ---
  delta_scale_init: 0.1

  # --- Heads ---
  head_dropout: 0.3

  # --- Ablation ---
  ablation: "none"  # none|no_residual|no_audio|no_vision|no_awaf_mean_residual|text_slstm_on

  # --- Aux ---
  use_aux_heads: false

training:
  batch_size: 32
  epochs: 60
  lr: 1.0e-4
  weight_decay: 0.01
  scheduler: "reduce_on_plateau"  # reduce_on_plateau | cosine
  scheduler_patience: 8
  scheduler_factor: 0.5
  warmup_epochs: 0
  grad_clip: 1.0
  amp: true
  strict_protocol: true
  seed: 42

  # --- Loss weights ---
  reg_loss_weight: 1.0
  cls_loss_weight: 0.5
  sign_consistency_weight: 0.1
  aux_loss_weight: 0.0
  delta_reg_weight: 0.05
  awaf_entropy_reg_weight: 0.0
  reg_loss_type: "l1"

data:
  feature_root: "data/features_strong_sequence_mosi_v3_T40"
  max_text_len: 50
  max_audio_len: 100
  max_vision_len: 50
  num_workers: 0
