# configs/models/ours_awaf_seq_xlstm.yaml
# P4V: AWAF-Seq + Cross-modal Transformer 主模型候选

model_name: ours_awaf_seq_xlstm

# Strong sequence feature dimensions
text_dim: 1024      # DeBERTa-large token-level
audio_dim: 768      # wav2vec2-base frame-level
vision_dim: 1024    # current CLIP .pt pooled vector, T=1
hidden_dim: 256

# Projection
proj_dropout: 0.1

# sLSTM
slstm_num_layers: 1
slstm_dropout: 0.2
slstm_bidirectional: false
slstm_pooling: masked_mean

# Cross-modal Transformer
cross_num_layers: 2
cross_num_heads: 4
cross_ffn_dim: 512
cross_dropout: 0.2
cross_use_modality_embedding: true

# Modality-level attention pooling
pooling_type: attention
pooling_dropout: 0.1

# AWAF sample-level fusion
awaf_fusion_mode: awaf
awaf_tau_init: 1.0
awaf_dropout: 0.2
awaf_modality_dropout: true
modality_dropout_prob: 0.2

# Prediction heads
head_reg_hidden: 128
head_cls_hidden: 128
head_dropout: 0.3
use_aux_heads: false

# Explicitly disabled historical candidates
use_deconv: false
use_cme: false
use_data2vec_audio: false

# Training defaults
train:
  lr: 0.0001
  weight_decay: 0.01
  batch_size: 16
  epochs: 40
  early_stopping_patience: 8
  best_metric: val_MAE
  reg_loss_weight: 1.0
  cls_loss_weight: 0.3
  aux_loss_weight: 0.0
  awaf_entropy_reg_weight: 0.0

feature_version: strong_sequence_mosi_v1
note: "AWAF-Seq = sLSTM sequence encoding + cross-modal transformer + masked attention pooling + sample-level AWAF. Vision is currently T=1 pooled CLIP .pt."
