# P6H-R Best Config — Based on R1-R4 sweep
# R2 entropy config selected: val_ACC2=87.96%, healthy AWAF entropy=1.005
# Full run: 50 epochs, test_final_once

model:
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

  slstm_num_layers: 1
  slstm_dropout: 0.2

  awaf_fusion_mode: "awaf"
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  tau_init: 3.0
  awaf_uniform_mix: 0.0
  lambda_awaf_entropy: 0.01

  use_uncertainty_gate: true
  gate_init_bias: 2.0

  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 0.5
  delta_scale_init: 0.2

training:
  seed: 42
  epochs: 50
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 3.0e-6
  weight_decay: 0.03
  early_stopping_patience: 10
  test_eval: false
  test_final_once: true
  val_only: false

output:
  root: "outputs/P6H_repair"
  exp_name: "BEST_R2_full_s42"
