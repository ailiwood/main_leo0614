# P6B: V2 + CLIP ViT-L/14 Vision (1024d) + current text/audio
model:
  name: "DeepTextXLSTMAWAFResidualV2"
  text_dim: 1024
  audio_dim: 768
  vision_dim: 1024
  hidden_dim: 256
  text_mlp_hidden: 512
  text_mlp_layers: 3
  text_mlp_dropout: 0.3
  slstm_num_layers: 1
  slstm_dropout: 0.3
  slstm_pooling: "masked_mean"
  awaf_fusion_mode: "awaf"
  awaf_tau_init: 1.0
  awaf_dropout: 0.1
  awaf_modality_dropout: true
  awaf_modality_dropout_prob: 0.1
  delta_scale_init: 0.1
  max_delta: 1.0
  use_bounded_delta: true
  use_uncertainty_gate: true
  use_delta_experts: true
  gate_hidden_dim: 128
  gate_dropout: 0.1
  head_dropout: 0.3
  ablation: "none"
  use_aux_heads: false

training:
  batch_size: 32
  epochs: 60
  lr: 1.0e-4
  weight_decay: 0.01
  scheduler: "reduce_on_plateau"
  scheduler_patience: 8
  scheduler_factor: 0.5
  grad_clip: 1.0
  amp: true
  strict_protocol: true
  seed: 42
  reg_loss_weight: 1.0
  cls_loss_weight: 0.5
  sign_consistency_weight: 0.1
  delta_reg_weight: 0.05
  delta_target_loss_weight: 0.2
  margin_sign_loss_weight: 0.05
  awaf_entropy_reg_weight: 0.0
  sample_reweight_enabled: false

data:
  feature_root: "data/features_strong_sequence_mosi_v6_vision_l14_full"
  max_text_len: 50
  max_audio_len: 100
  max_vision_len: 50
  num_workers: 0
