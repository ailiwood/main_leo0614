# configs/models/ours_c0_strong_sequence.yaml
# C0 on strong sequence features: DeBERTa token-level + wav2vec2 frame-level + CLIP pooled

model_name: ours_c0_strong_sequence

text_dim: 1024
audio_dim: 768
vision_dim: 1024
hidden_dim: 256
proj_dropout: 0.1

slstm_num_layers: 1
slstm_dropout: 0.3
slstm_bidirectional: false
slstm_pooling: masked_mean

awaf_fusion_mode: awaf
awaf_tau_init: 1.0
awaf_dropout: 0.3
awaf_modality_dropout: true
modality_dropout_prob: 0.2

head_reg_hidden: 128
head_cls_hidden: 128
head_dropout: 0.3
use_aux_heads: false

use_deconv: false
use_cme: false
use_data2vec_audio: false

feature_version: strong_sequence_mosi_v1
note: text/audio are T>1 sequences, vision currently T=1 pooled CLIP .pt
