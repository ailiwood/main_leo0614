# C1 = C0 + DEConv (DynamicFeatureEnhancer on vision)
model:
  text_dim: 1024; audio_dim: 1024; vision_dim: 1024
  hidden_dim: 256; proj_dropout: 0.1
  slstm_num_layers: 1; slstm_dropout: 0.3; slstm_bidirectional: false
  slstm_pooling: "masked_mean"
  awaf_fusion_mode: "awaf"; awaf_tau_init: 1.0; awaf_dropout: 0.3
  awaf_modality_dropout: true
  head_reg_hidden: 128; head_cls_hidden: 128; head_dropout: 0.3
  use_aux_heads: false
  # C1 specific
  use_deconv: true; use_cme: false; use_data2vec_audio: false
  deconv_kernel: 3; deconv_dropout: 0.1

training:
  seed: 42; epochs: 20; lr: 1.0e-4; weight_decay: 0.01
  batch_size: 32; device: "cuda"
  reg_loss_weight: 1.0; cls_loss_weight: 0.5; aux_loss_weight: 0.0
