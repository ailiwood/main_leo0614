# configs/models/deeptext_xlstm_awaf_residual_mosei_sdk.yaml
# DeepText-xLSTM-AWAF Residual — MOSEI SDK 维度兼容配置
# 仅用于维度兼容测试，不做正式训练
# dims: text=300, audio=74, vision=35

model:
  name: "DeepTextXLSTMAWAFResidual"
  # --- 维度 (MOSEI SDK) ---
  text_dim: 300
  audio_dim: 74
  vision_dim: 35
  hidden_dim: 128

  # --- Text branch ---
  text_mlp_hidden: 256
  text_mlp_layers: 2
  text_mlp_dropout: 0.3

  # --- sLSTM ---
  slstm_num_layers: 1
  slstm_dropout: 0.3
  slstm_pooling: "masked_mean"

  # --- AWAF ---
  awaf_fusion_mode: "awaf"
  awaf_tau_init: 1.0
  awaf_dropout: 0.1
  awaf_modality_dropout: true
  awaf_modality_dropout_prob: 0.1

  # --- Residual ---
  delta_scale_init: 0.1

  # --- Heads ---
  head_dropout: 0.3

  # --- Ablation ---
  ablation: "none"

  # --- Aux ---
  use_aux_heads: false

training:
  batch_size: 32
  epochs: 60
  lr: 1.0e-4
  weight_decay: 0.01
  scheduler: "reduce_on_plateau"
  scheduler_patience: 8
  scheduler_factor: 0.5
  warmup_epochs: 0
  grad_clip: 1.0
  amp: true
  strict_protocol: true
  seed: 42

  # --- Loss weights ---
  reg_loss_weight: 1.0
  cls_loss_weight: 0.5
  sign_consistency_weight: 0.1
  aux_loss_weight: 0.0
  delta_reg_weight: 0.05
  awaf_entropy_reg_weight: 0.0
  reg_loss_type: "l1"

data:
  # MOSEI SDK 特征路径 (待确认)
  feature_root: "data/CMU-MOSEI/features"
  max_text_len: 50
  max_audio_len: 200
  max_vision_len: 50
  num_workers: 0
