# P6E TextFT-xLSTM-AWAF Mainline — MOSI
model:
  name: "TextFTXLSTMAWAFResidual"
  text_model_name: "roberta-large"
  audio_dim: 768
  vision_dim: 768
  hidden_dim: 256
  text_dropout: 0.1
  text_pooling: "cls"
  slstm_num_layers: 1
  slstm_dropout: 0.2
  awaf_fusion_mode: "awaf"
  awaf_modality_dropout: true
  use_uncertainty_gate: true
  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 1.0
  delta_scale_init: 0.05
  freeze_bottom_k_layers: 12
  ablation: "none"

training:
  seed: 42
  epochs_stage1: 5
  epochs_stage2: 12
  epochs_stage3: 3
  batch_size: 2
  grad_accum_steps: 8
  lr_text: 1.0e-5
  lr_residual: 1.0e-4
  lr_stage3: 2.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler_patience: 4
  amp: true
  strict_protocol: true
  save_best_only: true
  formal_mode: true

dataset:
  name: "MOSI"
  csv_path: "data/mosi/label.csv"
  feature_root: "data/features_strong_sequence_mosi_v3_T40"
  max_text_len: 128
  max_audio_len: 100
  max_vision_len: 50

output:
  root: "outputs/P6E/mosi"
  save_predictions: true
  save_awaf_weights: true
  save_text_base_delta: true
  save_plots: true
