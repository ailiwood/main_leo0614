phase: P6S-Repair-4
model:
  mode: "text_audio_residual"
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 74
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
  slstm_num_layers: 1
  slstm_dropout: 0.2
  use_uncertainty_gate: true
  gate_init_bias: 2.0
  use_delta_experts: true
  max_delta: 1.0
  delta_scale_init: 0.2
data:
  dataset: mosei
  csv_path: data/processed/mosei_full/label.csv
  feature_root: data/processed/mosei_full
  formal_mode: true
training:
  seed: 42
  epochs: 12
  min_epochs: 3
  early_stopping_patience: 4
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  test_final_once: true
output:
  root: outputs/P6S_repair4/mosei/mainline
  exp_name: text_audio_cached_s42
