# P6T-PreFreeze: MOSEI Main Model text_audio_vision candidate
# TAV smoke + short run to assess multimodal gain
data:
  csv_path: data/processed/mosei_full/label.csv
  dataset: mosei
  feature_root: data/processed/mosei_full
  formal_mode: true
model:
  mode: text_av_residual
  audio_dim: 74
  vision_dim: 768
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ['query', 'value']
  awaf_fusion_mode: awaf
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  awaf_uniform_mix: 0.0
  lambda_awaf_entropy: 0.01
  freeze_text_base: false
  use_text_conf_residual: false
  use_uncertainty_gate: false
  use_delta_experts: false
output:
  exp_name: text_av_cached_s42
  root: outputs/P6T_prefreeze/mosei/mainline
phase: P6T-PreFreeze
training:
  batch_size: 4
  grad_accum_steps: 16
  epochs: 5
  early_stopping_patience: 4
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  seed: 42
  test_eval: true
  test_final_once: true
  val_only: false
  delta_loss_weight: 1.0
