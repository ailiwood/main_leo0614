phase: P6U-FREEZE
dataset: mosei
model_type: diagnostic
modality_mode: text_only
notes: Diagnostic only. Not the final main model.
data:
  csv_path: data/processed/mosei_full/label.csv
  dataset: mosei
  feature_root: data/processed/mosei_full
  formal_mode: true
model:
  mode: text_only
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - query
  - value
  freeze_text_base: false
training:
  batch_size: 8
  epochs: 20
  seed: 42
  early_stopping_patience: 6
  min_epochs: 5
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  test_final_once: true
