phase: P6U-FREEZE
dataset: mosi
model_type: main
modality_mode: text_audio
seed: 42
epochs: 20
notes: BEST MOSI main model (P6K). Frozen for thesis.
data:
  csv_path: data/mosi/label.csv
  dataset: mosi
  feature_root: data/features_strong_sequence_mosi_v3_T40
  formal_mode: true
model:
  mode: text_audio_residual
  audio_dim: 768
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - query
  - value
  awaf_fusion_mode: awaf
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  freeze_text_base: false
training:
  batch_size: 4
  grad_accum_steps: 16
  epochs: 20
  early_stopping_patience: 6
  min_epochs: 5
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  seed: 42
  test_final_once: true
