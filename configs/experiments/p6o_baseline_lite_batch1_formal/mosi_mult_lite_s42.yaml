phase: P6O
model:
  model_name: mult_lite
  modality_mode: text_audio_vision
  hidden_dim: 32
  dropout: 0.2
  rank: 8
  fusion_dim: 64
data:
  dataset: mosi
training:
  seed: 42
  epochs: 50
  min_epochs: 30
  early_stopping_patience: 10
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.01
  test_final_once: true
output:
  root: outputs/P6O/baseline_lite/mosi
