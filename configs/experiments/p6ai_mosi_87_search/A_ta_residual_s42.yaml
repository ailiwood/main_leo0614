phase: P6AI_FAMILY_A
dataset: mosi
data_version: mosi_tav_v1
cohort_id: mosi_official_tav_complete_case_v1
modalities: text_audio
seed: 42
notes: "P6AI Family A: P6K-compatible T+A residual recovery on mosi_tav_v1"
data:
  csv_path: data/mosi/label.csv
  dataset: mosi
  feature_root: data/processed/mosi_tav_v1
  formal_mode: true
model:
  mode: text_audio_residual
  audio_dim: 768
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  slstm_bidirectional: false
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - query
  - value
  temporal_encoder: slstm
  use_uncertainty_gate: true
  gate_init_bias: 2.0
  freeze_text_base: false
training:
  batch_size: 4
  grad_accum_steps: 16
  epochs: 25
  early_stopping_patience: 6
  min_epochs: 5
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  seed: 42
  test_final_once: true
output:
  exp_name: A_ta_residual_s42
  root: outputs/P6AI_mosi_87_search
