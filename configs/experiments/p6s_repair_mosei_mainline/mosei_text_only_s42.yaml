phase: P6S-Repair
model:
  mode: "text_only"
  text_model_name: "roberta-large"
  hidden_dim: 256
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
data:
  dataset: mosei
  csv_path: data/mosei/label.csv
  feature_root: data/processed/mosei_text_audio
  formal_mode: false
training:
  seed: 42
  epochs: 20
  batch_size: 4
  grad_accum_steps: 4
  lr: 5.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 0
  test_final_once: true
output:
  root: outputs/P6S_repair/mosei/text_only
  exp_name: mosei_text_only_s42
