# P6I: MOSI Text+Vision Residual
model:
  mode: "text_vision_residual"
  text_model_name: "roberta-large"
  hidden_dim: 256
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
  slstm_num_layers: 1
  slstm_dropout: 0.2
  use_uncertainty_gate: true
  gate_init_bias: 2.0
  use_delta_experts: true
  max_delta: 1.0
  delta_scale_init: 0.2

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true
  delta_loss_weight: 1.0

output:
  root: "outputs/P6I"
  exp_name: "text_vision_residual"
