# P6I: MOSI AV-Only signal check (audio+vision w/ AWAF)
model:
  mode: "av_only"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  slstm_num_layers: 1
  slstm_dropout: 0.2
  awaf_fusion_mode: "awaf"
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  awaf_uniform_mix: 0.0
  lambda_awaf_entropy: 0.01

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true

output:
  root: "outputs/P6I"
  exp_name: "av_only"
