# P6I: MOSI Text+AV Residual (AWAF fusion, old gate+delta)
model:
  mode: "text_av_residual"
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
  slstm_num_layers: 1
  slstm_dropout: 0.2
  awaf_fusion_mode: "awaf"
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  awaf_uniform_mix: 0.0
  lambda_awaf_entropy: 0.01
  use_uncertainty_gate: true
  gate_init_bias: 2.0
  use_delta_experts: true
  max_delta: 1.0
  delta_scale_init: 0.2

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true
  delta_loss_weight: 1.0

output:
  root: "outputs/P6I"
  exp_name: "text_av_residual"
