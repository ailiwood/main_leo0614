# P6H-R R1: 基础修复 — LayerNorm + τ=3.0 + dsr=0.2 + gate_bias=2.0
# 目标: 修复 AWAF 权重崩溃 + Delta 过小 + Gate 抑制

model:
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1

  # LoRA
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

  # sLSTM
  slstm_num_layers: 1
  slstm_dropout: 0.2

  # AWAF — Repair
  awaf_fusion_mode: "awaf"
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true        # [R] 模态 LN
  tau_init: 3.0                    # [R] τ 从 1.0→3.0
  awaf_uniform_mix: 0.0            # [R] 暂不开
  lambda_awaf_entropy: 0.0         # [R] 暂不开

  # Gate — Repair
  use_uncertainty_gate: true
  gate_init_bias: 2.0              # [R] 从 -1.5→+2.0

  # Delta — Repair
  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 0.5
  delta_scale_init: 0.2            # [R] 从 0.02→0.2

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5                       # residual + audio + vision
  lr_text_lora: 3.0e-6             # text LoRA 保守
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true                   # sweep 模式: 只看 val

output:
  root: "outputs/P6H_repair"
  exp_name: "R1_norm_tau3_dsr02_gate2"
