# P6H-R R3: 加 uniform mix + moderate entropy
# 目标: weight floor 防止任何模态权重过小

model:
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

  slstm_num_layers: 1
  slstm_dropout: 0.2

  awaf_fusion_mode: "awaf"
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  tau_init: 3.0
  awaf_uniform_mix: 0.10           # [R3] 10% uniform mix
  lambda_awaf_entropy: 0.005       # [R3] 轻量 entropy

  use_uncertainty_gate: true
  gate_init_bias: 2.0

  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 0.5
  delta_scale_init: 0.2

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 3.0e-6
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true

output:
  root: "outputs/P6H_repair"
  exp_name: "R3_uniform_mix"
