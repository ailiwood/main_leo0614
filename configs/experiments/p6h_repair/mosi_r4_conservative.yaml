# P6H-R R4: 保守残差 — τ=5.0 + dsr=0.1 + gate_bias=1.0 + 轻量 uniform_mix
# 目标: 最保守的修复，确保 text_base 不退化，残差缓慢增长

model:
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

  slstm_num_layers: 1
  slstm_dropout: 0.2

  awaf_fusion_mode: "awaf"
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  tau_init: 5.0                    # [R4] 更高温度
  awaf_uniform_mix: 0.05           # [R4] 5% uniform mix
  lambda_awaf_entropy: 0.01        # [R4] entropy reg

  use_uncertainty_gate: true
  gate_init_bias: 1.0              # [R4] 保守 gate bias

  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 0.3                   # [R4] 更小 max_delta
  delta_scale_init: 0.1            # [R4] 更小 dsr

training:
  seed: 42
  epochs: 30
  batch_size: 4
  grad_accum_steps: 4
  lr: 1.0e-5                       # [R4] 更低 lr
  lr_text_lora: 2.0e-6             # [R4] 更低 LoRA lr
  weight_decay: 0.03
  early_stopping_patience: 6
  test_eval: false
  test_final_once: false
  val_only: true

output:
  root: "outputs/P6H_repair"
  exp_name: "R4_conservative"
