# P6J Task 2: Reproduce P6H original text_base
# Match P6H original: lr=5e-5, 50 ep, text_only mode, seed=42

model:
  mode: "text_only"
  text_model_name: "roberta-large"
  hidden_dim: 256
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]

training:
  seed: 42
  epochs: 50
  batch_size: 4
  grad_accum_steps: 4
  lr: 5.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 10
  test_eval: false
  test_final_once: true
  val_only: false

output:
  root: "outputs/P6J"
  exp_name: "textbase_p6h_eq"
