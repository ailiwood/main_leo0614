phase: P6V-ABLATION
dataset: mosi
ablation_name: fusion_concat
fusion_type: concat
temporal_encoder: slstm
seed: 42
notes: 'MOSI ablation: fusion=concat, encoder=slstm'
data:
  csv_path: data/mosi/label.csv
  dataset: mosi
  feature_root: data/features_strong_sequence_mosi_v3_T40
  formal_mode: true
model:
  mode: text_audio_residual
  audio_dim: 768
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - query
  - value
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  freeze_text_base: false
  fusion_type: concat
  awaf_context: true
  awaf_interaction: true
  temporal_encoder: slstm
training:
  batch_size: 4
  grad_accum_steps: 16
  epochs: 8
  early_stopping_patience: 4
  min_epochs: 3
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  seed: 42
  test_final_once: true
output:
  exp_name: fusion_concat_s42
  root: outputs/P6V_ablation/mosi
