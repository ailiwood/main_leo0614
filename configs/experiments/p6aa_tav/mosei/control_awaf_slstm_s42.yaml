phase: P6AA_TAV
dataset: mosei
data_version: mosei_tav_openface2_v1
cohort_id: mosei_official_tav_intersection_v1
modalities: text_audio_vision
seed: 42
notes: "MOSEI TAV Canonical main model \u2014 smoke test"
data:
  csv_path: data/processed/mosei_full/label.csv
  dataset: mosei
  feature_root: data/processed/mosei_tav_openface2_v1
  formal_mode: true
model:
  mode: canonical_text_audio_vision_awaf_slstm
  audio_dim: 74
  vision_dim: 713
  hidden_dim: 256
  slstm_num_layers: 1
  slstm_dropout: 0.2
  text_model_name: roberta-large
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - query
  - value
  fusion_type: awaf
  temporal_encoder: slstm
  tau_init: 3.0
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: true
  freeze_text_base: false
training:
  batch_size: 8
  grad_accum_steps: 8
  epochs: 12
  early_stopping_patience: 4
  min_epochs: 3
  lr: 3.0e-05
  lr_text_lora: 3.0e-06
  weight_decay: 0.03
  seed: 42
  test_final_once: true
output:
  exp_name: control_awaf_slstm_s42
  root: outputs/P6AA_tav/mosei/main
