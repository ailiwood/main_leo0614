# P6K: Match P6H original setup — text_av_residual, no early stop, measure text_base
# P6H text_base=86.43% came from T+A+V co-training with AWAF
model:
  mode: "text_av_residual"          # match P6H: T+A+V + AWAF
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
  slstm_num_layers: 1
  slstm_dropout: 0.2
  # Match P6H AWAF
  awaf_fusion_mode: "awaf"
  tau_init: 1.0                    # P6H original (not 3.0)
  awaf_dropout: 0.1
  use_modality_dropout: true
  modality_dropout_prob: 0.1
  use_modal_layernorm: false       # P6H didn't have this
  lambda_awaf_entropy: 0.0         # P6H didn't have this
  # Match P6H Gate
  use_uncertainty_gate: true
  gate_init_bias: -1.5             # P6H original
  # Match P6H Delta
  use_delta_experts: true
  use_bounded_delta: true
  max_delta: 0.5
  delta_scale_init: 0.02           # P6H original (not 0.2)

training:
  seed: 42
  epochs: 50                       # match P6H: run all 50
  batch_size: 4
  grad_accum_steps: 4
  lr: 5.0e-5                       # match P6H: same lr for all
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 0       # disable early stopping (match P6H)
  test_eval: false
  test_final_once: true
  val_only: false

output:
  root: "outputs/P6K"
  exp_name: "textbase_recovery_multimodal"
