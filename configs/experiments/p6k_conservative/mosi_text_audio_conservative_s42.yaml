# P6K: text_audio conservative — text-dominant mainline candidate
# Uses P6I repair settings that achieved 88.72% test
model:
  mode: "text_audio_residual"
  text_model_name: "roberta-large"
  hidden_dim: 256
  audio_dim: 768
  vision_dim: 768
  text_mlp_hidden: 512
  text_dropout: 0.1
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: ["query", "value"]
  slstm_num_layers: 1
  slstm_dropout: 0.2
  use_uncertainty_gate: true
  gate_init_bias: 2.0
  use_delta_experts: true
  max_delta: 1.0
  delta_scale_init: 0.2

training:
  seed: 42
  epochs: 50
  batch_size: 4
  grad_accum_steps: 4
  lr: 3.0e-5
  lr_text_lora: 5.0e-5
  weight_decay: 0.03
  early_stopping_patience: 0
  test_eval: false
  test_final_once: true
  val_only: false
  delta_loss_weight: 1.0

output:
  root: "outputs/P6K"
  exp_name: "text_audio_conservative_s42"
