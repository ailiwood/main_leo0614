phase: P6R
model:
  model_name: mult_lite
  modality_mode: text_audio
  hidden_dim: 256
  dropout: 0.2
  use_pretrained_text: true
  text_input_dim: 1024
data:
  dataset: mosi
training:
  seed: 42
  epochs: 50
  min_epochs: 30
  early_stopping_patience: 10
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.01
  test_final_once: true
output:
  root: outputs/P6R/baseline_80pass/mosi
